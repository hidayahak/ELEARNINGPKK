<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY TVET Dashboard</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f0f2f5;
      color: #1f2328;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: #0f2d5e;
      color: #ffffff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header .logo {
      width: 40px;
      height: 40px;
      background: #3b82d4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    header p.subtitle {
      font-size: 0.8rem;
      color: #a8c0e8;
      margin-top: 1px;
    }

    /* ── Main Layout ──────────────────────────────────────── */
    main {
      max-width: 980px;
      margin: 32px auto;
      padding: 0 24px 48px;
    }

    /* ── Section Headings ─────────────────────────────────── */
    .section-heading {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #57606a;
      margin-bottom: 14px;
    }

    /* ── Cards Row ────────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 22px 24px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-top: 4px solid #e5e7eb;
    }

    .card.accent-blue  { border-top-color: #3b82d4; }
    .card.accent-green { border-top-color: #22c55e; }
    .card.accent-amber { border-top-color: #f59e0b; }

    .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #57606a;
      margin-bottom: 10px;
    }

    .card-primary {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1;
      color: #0f2d5e;
      margin-bottom: 12px;
    }

    .card-details {
      list-style: none;
      font-size: 0.83rem;
      color: #57606a;
    }

    .card-details li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-top: 1px solid #f0f2f5;
    }

    .card-details li:first-child { border-top: none; }

    .card-details .val {
      font-weight: 600;
      color: #1f2328;
    }

    /* Progress bar (Workshop Status card) */
    .progress-bar-wrap {
      background: #e5e7eb;
      border-radius: 999px;
      height: 7px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #f59e0b;
      transition: width 0.4s ease;
    }

    /* ── Checklist ────────────────────────────────────────── */
    .checklist-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 24px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .checklist-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .checklist-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #0f2d5e;
    }

    #checklist-counter {
      font-size: 0.82rem;
      font-weight: 600;
      color: #57606a;
      background: #f0f2f5;
      padding: 3px 10px;
      border-radius: 999px;
    }

    #checklist-counter.all-done {
      background: #dcfce7;
      color: #166534;
    }

    .checklist-list {
      list-style: none;
    }

    .checklist-list li {
      border-radius: 6px;
      transition: background 0.15s;
    }

    .checklist-list li:hover { background: #f7f8fa; }

    .checklist-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #1f2328;
    }

    .checklist-list input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #22c55e;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-list label.checked {
      text-decoration: line-through;
      color: #adb5bd;
    }

    .checklist-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
    }

    .btn-reset {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #57606a;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-reset:hover {
      background: #f0f2f5;
      border-color: #9ca3af;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">T</div>
    <div>
      <h1>MY TVET Dashboard</h1>
      <p class="subtitle">Student Workshop Management</p>
    </div>
  </header>

  <main>
    <p class="section-heading">Overview</p>
    <section class="cards" id="cards-container"></section>

    <p class="section-heading">Preparation Checklist</p>
    <div class="checklist-card">
      <div class="checklist-header">
        <h2>Pre-Session Checklist</h2>
        <span id="checklist-counter">0 / 7 complete</span>
      </div>
      <ul class="checklist-list" id="checklist-list"></ul>
      <div class="checklist-footer">
        <button class="btn-reset" id="btn-reset">Reset All</button>
      </div>
    </div>
  </main>

  <script>
    // ── Sample Data ────────────────────────────────────────
    const sampleData = {
      studentsRegistered: {
        registered: 38,
        capacity: 50,
        seatsLeft: 12,
        waitlist: 3
      },
      tasksRemaining: {
        total: 10,
        completed: 6,
        remaining: 4
      },
      workshopStatus: {
        status: "In Progress",
        sessionsHeld: 3,
        totalSessions: 5,
        nextSession: "2025-08-01"
      },
      checklistItems: [
        "Confirm venue / virtual meeting link",
        "Upload slide deck to shared folder",
        "Send attendance form link to students",
        "Distribute workshop materials / datasets",
        "Brief guest facilitator (if applicable)",
        "Publish assignment instructions",
        "Review feedback from previous session"
      ]
    };

    // ── Render Cards ───────────────────────────────────────
    function renderCards() {
      const container = document.getElementById('cards-container');
      const { studentsRegistered: sr, tasksRemaining: tr, workshopStatus: ws } = sampleData;

      const registrationPct = Math.round((sr.registered / sr.capacity) * 100);
      const sessionPct      = Math.round((ws.sessionsHeld / ws.totalSessions) * 100);

      const cards = [
        {
          accent: 'accent-blue',
          label: 'Students Registered',
          primary: sr.registered,
          details: [
            ['Capacity',      sr.capacity],
            ['Seats Left',    sr.seatsLeft],
            ['Waitlisted',    sr.waitlist],
            ['Fill Rate',     registrationPct + '%']
          ]
        },
        {
          accent: 'accent-green',
          label: 'Tasks Remaining',
          primary: tr.remaining,
          details: [
            ['Total Tasks',   tr.total],
            ['Completed',     tr.completed],
            ['Remaining',     tr.remaining],
            ['Progress',      Math.round((tr.completed / tr.total) * 100) + '%']
          ]
        },
        {
          accent: 'accent-amber',
          label: 'Workshop Status',
          primary: ws.status,
          progressPct: sessionPct,
          details: [
            ['Sessions Held',  ws.sessionsHeld + ' of ' + ws.totalSessions],
            ['Completion',     sessionPct + '%'],
            ['Next Session',   ws.nextSession]
          ]
        }
      ];

      container.innerHTML = cards.map(card => {
        const detailRows = card.details
          .map(([k, v]) => `<li><span>${k}</span><span class="val">${v}</span></li>`)
          .join('');

        const progressBar = card.progressPct !== undefined
          ? `<div class="progress-bar-wrap">
               <div class="progress-bar-fill" style="width:${card.progressPct}%"></div>
             </div>`
          : '';

        return `
          <div class="card ${card.accent}">
            <div class="card-label">${card.label}</div>
            <div class="card-primary">${card.primary}</div>
            ${progressBar}
            <ul class="card-details">${detailRows}</ul>
          </div>`;
      }).join('');
    }

    // ── Render Checklist ───────────────────────────────────
    function renderChecklist() {
      const list = document.getElementById('checklist-list');
      list.innerHTML = sampleData.checklistItems.map((item, i) => `
        <li>
          <label id="label-${i}">
            <input type="checkbox" data-index="${i}" />
            ${item}
          </label>
        </li>`
      ).join('');

      list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', updateCounter);
      });
    }

    function updateCounter() {
      const checkboxes = document.querySelectorAll('#checklist-list input[type="checkbox"]');
      const total    = checkboxes.length;
      const checked  = [...checkboxes].filter(cb => cb.checked).length;
      const counter  = document.getElementById('checklist-counter');

      counter.textContent = `${checked} / ${total} complete`;
      counter.classList.toggle('all-done', checked === total);

      checkboxes.forEach((cb, i) => {
        const label = document.getElementById(`label-${i}`);
        label.classList.toggle('checked', cb.checked);
      });
    }

    // ── Reset ──────────────────────────────────────────────
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.querySelectorAll('#checklist-list input[type="checkbox"]')
        .forEach(cb => { cb.checked = false; });
      updateCounter();
    });

    // ── Init ───────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      renderCards();
      renderChecklist();
      updateCounter();
    });
  </script>

</body>
</html>
